name: Temporary js-yaml security fix

on:
  push:
    branches:
      - fix/js-yaml-cve-20260914

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/js-yaml-cve-20260914
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Atualizar somente js-yaml no lockfile
        run: npm update js-yaml --package-lock-only --ignore-scripts

      - name: Validar versões seguras
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const found = [];
          for (const [path, meta] of Object.entries(lock.packages || {})) {
            if (!path.endsWith('node_modules/js-yaml')) continue;
            const version = String(meta.version || '');
            found.push([path, version]);
            const parts = version.split('.').map(Number);
            const [maj, min, patch] = parts;
            const safe3 = maj === 3 && (min > 15 || (min === 15 && patch >= 2));
            const safe4 = maj === 4 && (min > 3 || (min === 3 && patch >= 2));
            const safe5 = maj >= 5;
            if (!(safe3 || safe4 || safe5)) {
              throw new Error(`Versão vulnerável restante: ${path} -> ${version}`);
            }
          }
          if (!found.length) throw new Error('Nenhuma instalação de js-yaml encontrada no lockfile.');
          console.log('js-yaml resolvido com segurança:', found);
          NODE

      - name: Remover workflow temporário e publicar lockfile
        run: |
          rm -f .github/workflows/security-js-yaml-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/security-js-yaml-fix.yml
          git commit -m "fix: atualizar js-yaml para versões seguras"
          git push origin HEAD:fix/js-yaml-cve-20260914
